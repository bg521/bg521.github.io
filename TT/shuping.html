<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>饼干❤️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
        body {
            background: url('http://pyh.baby/bgtp/BG.php') no-repeat center center fixed;
            background-size: cover; color: #FFB9B9; line-height: 1.6; position: relative; min-height: 100vh; overflow-x: hidden;
        }
        .characters-container { position: relative; width: 100%; height: 230px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; overflow: hidden; }
        .character { height: 90px; width: 90px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 178, 236, 0.76); box-shadow: 0 2px 15px rgba(255, 178, 236, 1); transition: transform 1.5s ease-out; z-index: 2; position: absolute; }
        .boy { left: -200px; transform: translateX(-100%); }
        .girl { right: -200px; transform: translateX(100%); }
        .characters-moved .boy { transform: translateX(0); left: 20%; }
        .characters-moved .girl { transform: translateX(0); right: 20%; }
        .heart-line { position: absolute; width: 250px; height: 90px; left: 50%; top: 51%; transform: translate(-50%, -50%); z-index: 1; opacity: 0; transition: opacity 1s ease 1.5s; }
        .characters-moved .heart-line { opacity: 1; }
        .heart-line svg { width: 100%; height: 100%; }
        .heart-beat { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 36px; color: #ff6b6b; opacity: 0; animation: none; z-index: 3; text-shadow: 0 0 10px red; }
        .characters-moved .heart-beat { opacity: 1; animation: heartbeat 1s infinite; }
        @keyframes heartbeat { 0% { transform: translate(-50%, -50%) scale(1); } 25% { transform: translate(-50%, -50%) scale(1.2); } 50% { transform: translate(-50%, -50%) scale(1); } 75% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .main-content { padding: 20px; padding-top: 0; position: relative; z-index: 1; min-height: calc(100vh - 220px); transition: opacity 0.3s; }
        .main-content.hidden, .music-player.hidden { display: none; }
        .card { background: rgba(255, 255, 255, 0); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #ffb1b1; transition: transform 0.3s ease; backdrop-filter: blur(1.5px); cursor: pointer; }
        .card:active { transform: scale(0.98); }
        .card h2 { color: #FF51A6; margin-bottom: 15px; font-size: 1.35rem; font-weight: 300; }
        .card p { color: white; font-size: 0.95rem; }
        .photo-card { background: rgba(255, 202, 202, 0.7); }
        .video-card { background: rgba(158, 227, 255, 0.7); }
        .notice-card { background: rgba(255, 255, 255, 0.7); margin-top: -50px; }
        .notice-text { min-height: auto; color: rgba(0,0,0,0.9); font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; overflow: hidden; }
        .cursor { display: inline-block; width: 2px; height: 16px; background: #4DD6FF; vertical-align: middle; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
        .heart { position: absolute; pointer-events: none; animation: floatUp linear; z-index:0; }
        .heart.top-layer { z-index:10; }
        @keyframes floatUp { to { transform: translateY(-100vh); } }
        
        /* 设置按钮与面板 */
        .settings-btn { position: fixed; top:20px; right:20px; background:rgba(255, 107, 107, 0.19); width:40px; height:40px; border-radius:50%; display:flex; justify-content:center; align-items:center; z-index:100; cursor:pointer; transition:all 0.3s; }
        .settings-btn i { color:pink; font-size:20px; }
        .settings-panel { position:fixed; top:70px; right:20px; background:rgba(0,0,0,0.3); border-radius:12px; padding:15px; width:270px; z-index:100; transform:translateX(120%); transition:transform 0.3s; backdrop-filter:blur(5px); border:1px solid rgba(255,255,255,0.2); }
        .settings-panel.show { transform:translateX(0); }
        .settings-panel h3 { margin-bottom:15px; color:#FFB4B4; font-size:1.2rem; border-bottom:1px solid #ffa0a0; padding-bottom:5px; 
            text-align: center;
        }
        .setting-item { margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
        .setting-item label { color: #ffd5d5; font-size:0.95rem; flex:1; }
        .setting-item .slider-container { display:flex; align-items:center; gap:8px; width:100%; margin-top:5px; }
        .slider { flex:1; }
        .slider-value { color:pink; min-width:45px; text-align:right; }
        
        /* 统一开关样式 - 所有开关使用完全相同的尺寸 */
        .toggle-container { display:flex; align-items:center; justify-content:space-between; width:100%; }
        .toggle-switch { 
        position:relative; 
        display:inline-block; 
        width: 46px !important;
        min-width: 46px;
        max-width: 46px;  /* 添加这一行，限制最大宽度 */
        height: 22px; 
        margin-left: 10px;
        flex-shrink: 0;   /* 添加这一行，防止被压缩 */
        flex-grow: 0;     /* 添加这一行，防止被拉伸 */
        }
        .toggle-switch input { 
            opacity:0; 
            width:0; 
            height:0; 
        }
        .toggle-slider { 
            position:absolute; 
            cursor:pointer; 
            top:0; 
            left:0; 
            right:0; 
            bottom:0; 
            background-color:#aaa; 
            transition:.3s; 
            border-radius:34px; 
        }
        .toggle-slider:before { 
            position:absolute; 
            content:""; 
            height: 18px; 
            width: 18px; 
            left: 2px; 
            bottom: 2px; 
            background-color:white; 
            transition:.3s; 
            border-radius:50%; 
        }
        input:checked + .toggle-slider { 
            background-color:#ff6b9d; 
        }
        input:checked + .toggle-slider:before { 
            transform: translateX(24px);  /* 46px - 18px - 4px = 24px，正好在中间 */
        }

        /* 独立页面样式 */
        .page { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:1000; overflow-y:auto; transform:translateX(100%); transition:transform 0.3s; padding:20px; padding-top:70px; }
        .page.active { transform:translateX(0); }
        .page-header { position:fixed; top:0; left:0; right:0; padding:15px 20px; background:rgba(0,0,0,0.3); z-index:100; display:flex; justify-content:center; align-items:center; border-bottom:1px solid #0096ff; backdrop-filter:blur(5px); }
        .page-title { font-size:1.2rem; text-align:center; flex-grow:1; padding:0 50px; color:#fff0f0; }
        .close-page { position:fixed; top:11px; right:20px; background:rgba(255,255,255,0.2); border:none; color:pink; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:101; }

        /* 相册分页控件 - 只在底部显示一组 */
        .pagination-controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            margin: 20px 0 10px; 
        }
        .pagination-btn { 
            background: rgba(255,255,255,0.25); 
            border: none; 
            color: white; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            font-size: 18px; 
            cursor: pointer; 
            backdrop-filter: blur(2px); 
            transition: 0.2s; 
        }
        .pagination-btn:disabled { 
            opacity: 0.3; 
            pointer-events: none; 
        }
        .pagination-info { 
            color: white; 
            font-size: 1rem; 
            background: rgba(0,0,0,0.3); 
            padding: 5px 20px; 
            border-radius: 30px; 
        }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .gallery img { 
            width:100%; 
            height:120px; 
            object-fit:cover; 
            border-radius:8px; 
            box-shadow:0 2px 8px #ff62a0; 
            transition:0.3s; 
            border:1px solid #78d2ff; 
            cursor:pointer; 
        }
        .gallery img:hover { 
            transform:scale(1.02); 
            box-shadow:0 5px 15px rgba(0,0,0,0.7); 
        }

        /* 视频页 */
        .video-list { display:grid; grid-template-columns:1fr; gap:25px; margin-bottom:20px; }
        .video-item { background:rgba(255,215,215,0.6); border-radius:auto; overflow:hidden; }
        .video-player-container { width:100%; aspect-ratio:16/9; position:relative; }
        .video-player { width:100%; height:100%; object-fit:cover; }
        .video-poster { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
        .play-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:pink; font-size:40px; opacity:0.8; cursor:pointer; }

        /* 图片查看器 - 确保功能完整 */
        .image-viewer { 
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%; 
            background:rgba(0,0,0,0.9); 
            display:flex; 
            align-items:center; 
            justify-content:center; 
            z-index:2000; 
            opacity:0; 
            pointer-events:none; 
            transition:opacity 0.3s; 
        }
        .image-viewer.active { 
            opacity:1; 
            pointer-events:all; 
        }
        .image-viewer-content { 
            display:flex; 
            width:100%; 
            height:100%; 
            align-items:center; 
            overflow-x:auto; 
            scroll-snap-type:x mandatory; 
            scroll-behavior:smooth; 
            -webkit-overflow-scrolling: touch;
        }
        .image-slide { 
            min-width:100vw; 
            height:100%; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            scroll-snap-align:center; 
            padding:20px; 
        }
        .image-slide img { 
            max-width:100%; 
            max-height:90vh; 
            object-fit:contain; 
            border-radius:8px; 
        }
        .close-viewer { 
            position:absolute; 
            top:20px; 
            right:20px; 
            background:rgba(255,255,255,0.3); 
            border:none; 
            color:white; 
            width:44px; 
            height:44px; 
            border-radius:50%; 
            font-size:24px; 
            cursor:pointer; 
            z-index:2001; 
            display:flex; 
            align-items:center; 
            justify-content:center; 
        }
        .image-counter { 
            position:absolute; 
            bottom:20px; 
            left:0; 
            right:0; 
            text-align:center; 
            color:white; 
            font-size:16px; 
            z-index:2001; 
        }
        .indicator { 
            position:absolute; 
            bottom:70px; 
            left:0; 
            right:0; 
            display:flex; 
            justify-content:center; 
            gap:10px; 
            z-index:2001; 
        }
        .indicator-dot { 
            width:8px; 
            height:8px; 
            border-radius:50%; 
            background:rgba(255,255,255,0.5); 
            transition:0.3s; 
            cursor:pointer; 
        }
        .indicator-dot.active { 
            background:#ff6b9d; 
            transform:scale(1.3); 
        }

        .music-player { position:fixed; bottom:20px; right:20px; z-index:100; transition:opacity 0.3s; }
        .music-btn { width:60px; height:60px; border-radius:50%; background:rgba(255,105,134,0.75); border:none; color:white; font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
        .music-tooltip { position:absolute; bottom:70px; right:0; background:rgba(0,0,0,0.7); color:white; padding:10px 15px; border-radius:20px; font-size:0.9rem; max-width:200px; opacity:0; transition:opacity 0.3s; pointer-events:none; white-space:nowrap; }
        .music-tooltip.show { opacity:1; }

        @media (max-width:600px) { 
            .gallery { grid-template-columns: repeat(2, 1fr); } 
            .gallery img { height:100px; } 
        }
        @media (max-width:400px) { 
            .settings-panel { width:240px; } 
            .characters-moved .boy { left:10%; } 
            .characters-moved .girl { right:10%; } 
        }
    </style>
</head>
<body>
    <!-- 设置按钮与面板 (包含相册分页开关) -->
    <div class="settings-btn" id="settingsBtn"><i class="fas fa-cog"></i></div>
    <div class="settings-panel" id="settingsPanel">
        <h3>设置</h3>
        <div class="setting-item">
            <label>生成频率</label>
            <div class="slider-container">
                <input type="range" min="100" max="2000" value="500" class="slider" id="heartRateSlider">
                <span class="slider-value" id="heartRateValue">500ms</span>
            </div>
        </div>
        <div class="setting-item">
            <label>点击数量</label>
            <div class="slider-container">
                <input type="range" min="1" max="20" value="5" class="slider" id="heartCountSlider">
                <span class="slider-value" id="heartCountValue">5</span>
            </div>
        </div>
        <div class="setting-item">
            <div class="toggle-container">
                <span class="toggle-label">爱心显示最上层</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="topLayerToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <!-- 相册分页开关 (在设置面板内) -->
        <div class="setting-item" style="border-top:1px solid rgba(255,200,200,0.3); padding-top:10px;">
            <div class="toggle-container">
                <span class="toggle-label">📸相册分页 (10/页)</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="paginationToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <p style="font-size:0.8rem; color:#ffc0c0; margin-top:5px;">开启后分批加载，提升速度</p>
        </div>
    </div>

    <div id="hearts-container"></div>
    
    <!-- 人物动画区域 -->
    <div class="characters-container" id="charactersContainer">
        <img src="BGku/boy.png" class="character boy" alt="男孩" style="width:90px;height:90px;">
        <img src="BGku/girl.png" class="character girl" alt="女孩" style="width:90px;height:90px;">
        <div class="heart-line">
            <svg viewBox="0 0 280 60">
                <path d="M0,30 Q20,10 40,30 Q60,5 80,30 Q100,50 120,30 Q140,10 160,30 Q180,50 200,30 Q220,10 240,30 Q260,50 280,30" stroke="#ff6b6b" stroke-width="3" fill="none" stroke-dasharray="280" stroke-dashoffset="280">
                    <animate attributeName="stroke-dashoffset" from="280" to="0" dur="1.2s" begin="1.5s" fill="freeze" repeatCount="indefinite"/>
                </path>
                <path d="M0,30 Q20,10 40,30 Q60,5 80,30 Q100,50 120,30 Q140,10 160,30 Q180,50 200,30 Q220,10 240,30 Q260,50 280,30" stroke="rgba(255,255,255,0.2)" stroke-width="5" fill="none" stroke-dasharray="280" stroke-dashoffset="280">
                    <animate attributeName="stroke-dashoffset" from="280" to="0" dur="1.2s" begin="1.5s" fill="freeze" repeatCount="indefinite"/>
                </path>
            </svg>
        </div>
        <div class="heart-beat"><i class="fas fa-heart"></i></div>
    </div>
    
    <!-- 主页面卡片 -->
    <div class="main-content">
        <div class="card notice-card">
            <h2 style="text-align:center;">小本本</h2>
            <div class="notice-text" id="noticeText"></div>
        </div>
        <div class="card photo-card" id="photosBtn">
            <h2>我们的照片</h2>
            <p>点击查看我们的美好回忆</p>
        </div>
        <div class="card video-card" id="videosBtn">
            <h2>我们的视频</h2>
            <p>点击查看我们的点点滴滴</p>
        </div>
    </div>
    
    <!-- 音乐播放器 -->
    <div class="music-player">
        <div class="music-tooltip" id="musicTooltip">点击右下角或空白区域播放音乐</div>
        <button class="music-btn" id="musicBtn"><i class="fas fa-music"></i></button>
    </div>

    <!-- 相册页面 (只保留底部一组翻页按钮) -->
    <div class="page" id="photosPage">
        <div class="page-header"><h2 class="page-title">我们的照片</h2></div>
        <button class="close-page" id="closePhotosPage"><i class="fas fa-arrow-left"></i></button>
        <div style="padding:5px 0 20px;">
            <!-- 相册网格 -->
            <div id="gallery" class="gallery"></div>
            <!-- 底部翻页控件 (只有这一组) -->
            <div id="paginationControls" class="pagination-controls" style="margin-top:10px;">
                <button class="pagination-btn" id="prevPage"><i class="fas fa-chevron-left"></i></button>
                <span class="pagination-info" id="pageInfo">1/1</span>
                <button class="pagination-btn" id="nextPage"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- 视频页面 -->
    <div class="page" id="videosPage">
        <div class="page-header"><h2 class="page-title">我们的视频</h2></div>
        <button class="close-page" id="closeVideosPage"><i class="fas fa-arrow-left"></i></button>
        <div class="video-list" id="videoList"></div>
    </div>

    <!-- 图片查看器 (确保功能完整) -->
    <div class="image-viewer" id="imageViewer">
        <button class="close-viewer" id="closeImageViewer"><i class="fas fa-times"></i></button>
        <div class="image-viewer-content" id="viewerContent"></div>
        <div class="indicator" id="indicator"></div>
        <div class="image-counter" id="imageCounter"></div>
    </div>
    
    <!-- 背景音乐 -->
    <audio id="bgMusic" loop><source src="BGku/music.mp3" type="audio/mpeg"></audio>

    <script>
        (function() {
            // ==================== 爱心功能 ====================
            let heartRate = 500, clickHeartCount = 5, isTopLayer = false;
            const heartsContainer = document.getElementById('hearts-container');
            
            function createHeart(x, y) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '<i class="fas fa-heart"></i>';
                const size = Math.random() * 20 + 10;
                heart.style.fontSize = size + 'px';
                const colors = ['#ff6b6b','#ff8787','#f06595','#cc5de8','#845ef7','#5c7cfa','#339af0'];
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                const duration = Math.random() * 5 + 5;
                const delay = Math.random() * 2;
                heart.style.animation = `floatUp ${duration}s linear ${delay}s forwards`;
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                if (isTopLayer) heart.classList.add('top-layer');
                heartsContainer.appendChild(heart);
                setTimeout(() => heart.remove(), (duration + delay) * 1000);
            }
            
            let heartInterval;
            function autoGenerateHearts() {
                if (heartInterval) clearInterval(heartInterval);
                const width = window.innerWidth;
                const height = window.innerHeight;
                heartInterval = setInterval(() => {
                    createHeart(Math.random() * width, height + 50);
                }, heartRate);
            }
            
            // 点击生成爱心
            document.addEventListener('click', (e) => {
                if (e.target.closest('#settingsBtn') || e.target.closest('#settingsPanel') || e.target.closest('.music-btn')) return;
                for (let i = 0; i < clickHeartCount; i++) {
                    createHeart(e.clientX + (Math.random() - 0.5) * 100, e.clientY + (Math.random() - 0.5) * 100);
                }
            });

            // ==================== 设置面板 ====================
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            let isSettingsOpen = false;
            
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isSettingsOpen = !isSettingsOpen;
                settingsPanel.classList.toggle('show', isSettingsOpen);
            });
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#settingsPanel') && !e.target.closest('#settingsBtn')) {
                    isSettingsOpen = false;
                    settingsPanel.classList.remove('show');
                }
            });

            // 频率滑块
            document.getElementById('heartRateSlider').addEventListener('input', function() {
                heartRate = +this.value;
                document.getElementById('heartRateValue').innerText = heartRate + 'ms';
                autoGenerateHearts();
            });
            
            // 数量滑块
            document.getElementById('heartCountSlider').addEventListener('input', function() {
                clickHeartCount = +this.value;
                document.getElementById('heartCountValue').innerText = clickHeartCount;
            });
            
            // 层级切换
            document.getElementById('topLayerToggle').addEventListener('change', function() {
                isTopLayer = this.checked;
                document.querySelectorAll('.heart').forEach(h => {
                    if (isTopLayer) h.classList.add('top-layer');
                    else h.classList.remove('top-layer');
                });
            });

            // ==================== 打字公告 ====================
            async function typeNotice() {
                const el = document.getElementById('noticeText');
                el.innerHTML = '<span class="cursor"></span>';
                try {
                    const res = await fetch('BGku/wenan.txt');
                    if (!res.ok) throw new Error();
                    const text = await res.text();
                    let i = 0;
                    const interval = setInterval(() => {
                        if (i < text.length) {
                            el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
                            i++;
                        } else {
                            clearInterval(interval);
                            el.innerHTML = text;
                        }
                    }, 120);
                } catch {
                    el.innerHTML = '小本本加载失败，请检查文件';
                }
            }

            // ==================== 页面导航 ====================
            const photosBtn = document.getElementById('photosBtn');
            const videosBtn = document.getElementById('videosBtn');
            const photosPage = document.getElementById('photosPage');
            const videosPage = document.getElementById('videosPage');
            const closePhotos = document.getElementById('closePhotosPage');
            const closeVideos = document.getElementById('closeVideosPage');
            const mainContent = document.querySelector('.main-content');
            const musicPlayer = document.querySelector('.music-player');
            
            function openPage(page) {
                mainContent.classList.add('hidden');
                musicPlayer.classList.add('hidden');
                document.documentElement.style.overflow = 'hidden';
                page.classList.add('active');
            }
            
            function closePage(page) {
                mainContent.classList.remove('hidden');
                musicPlayer.classList.remove('hidden');
                document.documentElement.style.overflow = '';
                page.classList.remove('active');
            }
            
            photosBtn.addEventListener('click', () => {
                openPage(photosPage);
                loadPhotos();
            });
            
            videosBtn.addEventListener('click', () => {
                openPage(videosPage);
                loadVideos();
            });
            
            closePhotos.addEventListener('click', () => closePage(photosPage));
            closeVideos.addEventListener('click', () => {
                pauseAllVideos();
                closePage(videosPage);
            });

            // ==================== 相册分页核心 ====================
            const paginationToggle = document.getElementById('paginationToggle');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');
            const paginationControls = document.getElementById('paginationControls');
            const gallery = document.getElementById('gallery');

            let allPhotoUrls = [];
            let currentPage = 1;
            const pageSize = 10;  // 每页6张，可在此修改

            // 渲染相册
            function renderGallery() {
                if (!allPhotoUrls.length) {
                    gallery.innerHTML = '<p style="color:white;text-align:center;grid-column:span 3;">✨ 暂无照片 ✨</p>';
                    updatePaginationUI(0);
                    return;
                }
                
                const paginationEnabled = paginationToggle.checked;
                let displayUrls = allPhotoUrls;
                let totalPages = 1;
                
                if (paginationEnabled) {
                    totalPages = Math.ceil(allPhotoUrls.length / pageSize) || 1;
                    if (currentPage > totalPages) currentPage = totalPages;
                    const start = (currentPage - 1) * pageSize;
                    displayUrls = allPhotoUrls.slice(start, start + pageSize);
                } else {
                    currentPage = 1;
                }
                
                // 清空并重新构建网格
                gallery.innerHTML = '';
                displayUrls.forEach((url, idx) => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = 'photo';
                    img.loading = 'lazy'; // 懒加载提升性能
                    img.dataset.globalIndex = allPhotoUrls.indexOf(url);
                    img.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const globalIdx = parseInt(e.target.dataset.globalIndex);
                        openImageViewer(allPhotoUrls, globalIdx);
                    });
                    gallery.appendChild(img);
                });
                
                // 分页模式下补齐空白占位，保持网格美观
                if (paginationEnabled && displayUrls.length < pageSize) {
                    for (let i = displayUrls.length; i < pageSize; i++) {
                        const dummy = document.createElement('div');
                        dummy.style.height = '0';
                        dummy.style.opacity = '0';
                        gallery.appendChild(dummy);
                    }
                }
                
                updatePaginationUI(totalPages);
            }

            function updatePaginationUI(totalPages) {
                const paginationEnabled = paginationToggle.checked;
                const show = paginationEnabled && allPhotoUrls.length > pageSize;
                paginationControls.style.display = show ? 'flex' : 'none';
                
                if (show) {
                    pageInfo.innerText = `${currentPage}/${totalPages}`;
                    prevBtn.disabled = currentPage <= 1;
                    nextBtn.disabled = currentPage >= totalPages;
                }
            }

            function changePage(delta) {
                if (!paginationToggle.checked) return;
                const total = Math.ceil(allPhotoUrls.length / pageSize);
                const newPage = currentPage + delta;
                if (newPage >= 1 && newPage <= total) {
                    currentPage = newPage;
                    renderGallery();
                }
            }
            
            prevBtn.addEventListener('click', () => changePage(-1));
            nextBtn.addEventListener('click', () => changePage(1));
            
            paginationToggle.addEventListener('change', function() {
                if (photosPage.classList.contains('active')) {
                    renderGallery();
                }
            });

            // 加载相册图片
            async function loadPhotos() {
                gallery.innerHTML = '<p style="color:white;text-align:center;grid-column:span 3;">在努力加载中哦...</p>';
                 //加载时隐藏翻页按钮
                 paginationControls.style.display = 'none';
                const urls = [];
                let i = 1;
                
                const checkImage = async (url) => {
                    try {
                        const res = await fetch(url, { method: 'HEAD' });
                        return res.ok;
                    } catch {
                        return false;
                    }
                };
                
                while (true) {
                    if (await checkImage(`photo/${i}.jpg`)) {
                        urls.push(`photo/${i}.jpg`);
                        i++;
                    } else if (await checkImage(`photo/${i}.png`)) {
                        urls.push(`photo/${i}.png`);
                        i++;
                    } else {
                        break;
                    }
                }
                
                allPhotoUrls = urls;
                currentPage = 1;
                renderGallery();
            }

            // ==================== 图片查看器 ====================
            let currentViewerIdx = 0;
            let viewerUrls = [];
            const imageViewer = document.getElementById('imageViewer');
            const viewerContent = document.getElementById('viewerContent');
            const indicator = document.getElementById('indicator');
            const imageCounter = document.getElementById('imageCounter');
            const closeViewer = document.getElementById('closeImageViewer');

            function openImageViewer(urls, index) {
                // 临时隐藏相册页的返回按钮
                document.getElementById('photosPage').style.visibility = 'hidden';
                
                viewerUrls = urls;
                currentViewerIdx = index;
                
                // 清空并重新构建
                viewerContent.innerHTML = '';
                indicator.innerHTML = '';
                
                urls.forEach((url, i) => {
                    const slide = document.createElement('div');
                    slide.className = 'image-slide';
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = `photo-${i+1}`;
                    slide.appendChild(img);
                    viewerContent.appendChild(slide);
                    
                    const dot = document.createElement('div');
                    dot.className = 'indicator-dot';
                    dot.dataset.index = i;
                    dot.addEventListener('click', () => goToViewerImage(parseInt(dot.dataset.index)));
                    indicator.appendChild(dot);
                });
                
                imageViewer.classList.add('active');
                document.body.style.overflow = 'hidden';
                updateViewerIndicators();
                
                // 滚动到当前图片
                setTimeout(() => {
                    viewerContent.scrollTo({
                        left: currentViewerIdx * window.innerWidth,
                        behavior: 'auto'
                    });
                }, 50);
            }

            function closeImageViewer() {
                imageViewer.classList.remove('active');
                document.body.style.overflow = '';
                document.getElementById('photosPage').style.visibility = 'visible';
            }

            function updateViewerIndicators() {
                document.querySelectorAll('.indicator-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentViewerIdx);
                });
                imageCounter.innerText = `${currentViewerIdx + 1}/${viewerUrls.length}`;
            }

            function goToViewerImage(index) {
                if (index < 0 || index >= viewerUrls.length) return;
                currentViewerIdx = index;
                viewerContent.scrollTo({
                    left: index * window.innerWidth,
                    behavior: 'smooth'
                });
                updateViewerIndicators();
            }

            // 监听滚动更新索引
            viewerContent.addEventListener('scroll', () => {
                if (!imageViewer.classList.contains('active')) return;
                const scrollLeft = viewerContent.scrollLeft;
                const index = Math.round(scrollLeft / window.innerWidth);
                if (index >= 0 && index < viewerUrls.length && index !== currentViewerIdx) {
                    currentViewerIdx = index;
                    updateViewerIndicators();
                }
            });

            closeViewer.addEventListener('click', closeImageViewer);

            // ==================== 视频功能 ====================
            let currentPlayingVideo = null;
            let musicTimeBeforeVideo = 0;
            let userManuallyPausedMusic = false;
            let videoElements = [];

            function pauseAllVideos() {
                videoElements.forEach(v => {
                    if (v && !v.paused) {
                        v.pause();
                        const container = v.parentElement;
                        if (container) {
                            const poster = container.querySelector('.video-poster');
                            const icon = container.querySelector('.play-icon');
                            if (poster) poster.style.display = 'block';
                            if (icon) icon.style.display = 'block';
                        }
                    }
                });
                currentPlayingVideo = null;
                
                if (musicTimeBeforeVideo > 0) {
                    bgMusic.currentTime = musicTimeBeforeVideo;
                    if (!userManuallyPausedMusic) {
                        playMusic();
                    }
                    musicTimeBeforeVideo = 0;
                }
            }

            function cleanupVideos() {
                videoElements.forEach(v => {
                    v.pause();
                    v.src = '';
                    v.load();
                });
                videoElements = [];
            }

            async function loadVideos() {
                const videoList = document.getElementById('videoList');
                videoList.innerHTML = '<p style="color:white; text-align:center;">加载视频列表...</p>';
                
                try {
                    cleanupVideos();
                    const urls = [];
                    let i = 1;
                    
                    while (i <= 20) {
                        const mp4Ok = await fetch(`move/${i}.mp4`, { method: 'HEAD' }).then(r => r.ok).catch(() => false);
                        if (mp4Ok) {
                            urls.push(`move/${i}.mp4`);
                            i++;
                        } else {
                            const movOk = await fetch(`move/${i}.mov`, { method: 'HEAD' }).then(r => r.ok).catch(() => false);
                            if (movOk) {
                                urls.push(`move/${i}.mov`);
                                i++;
                            } else {
                                break;
                            }
                        }
                    }
                    
                    if (!urls.length) {
                        videoList.innerHTML = '<p style="color:white; text-align:center;">暂无视频</p>';
                        return;
                    }
                    
                    videoList.innerHTML = '';
                    urls.forEach((url, idx) => {
                        const posterUrl = `movephoto/${idx + 1}.png`;
                        const item = document.createElement('div');
                        item.className = 'video-item';
                        item.innerHTML = `
                            <div class="video-player-container">
                                <video class="video-player" preload="none" controls>
                                    <source src="${url}" type="video/mp4">
                                </video>
                                <img src="${posterUrl}" class="video-poster" alt="封面加载出问题啦">
                                <div class="play-icon"><i class="fas fa-play"></i></div>
                            </div>
                        `;
                        
                        const container = item.querySelector('.video-player-container');
                        const poster = container.querySelector('.video-poster');
                        const playIcon = container.querySelector('.play-icon');
                        const video = container.querySelector('.video-player');
                        
                        videoElements.push(video);
                        
                        const playVideo = () => {
                            if (currentPlayingVideo && currentPlayingVideo !== video) {
                                currentPlayingVideo.pause();
                                const oldContainer = currentPlayingVideo.parentElement;
                                if (oldContainer) {
                                    const oldPoster = oldContainer.querySelector('.video-poster');
                                    const oldIcon = oldContainer.querySelector('.play-icon');
                                    if (oldPoster) oldPoster.style.display = 'block';
                                    if (oldIcon) oldIcon.style.display = 'block';
                                }
                            }
                            
                            if (isMusicPlaying) {
                                musicTimeBeforeVideo = bgMusic.currentTime;
                                pauseMusic();
                            }
                            
                            poster.style.display = 'none';
                            playIcon.style.display = 'none';
                            video.play().catch(() => {
                                poster.style.display = 'block';
                                playIcon.style.display = 'block';
                            });
                            currentPlayingVideo = video;
                            
                            const onVideoEnd = () => {
                                poster.style.display = 'block';
                                playIcon.style.display = 'block';
                                currentPlayingVideo = null;
                                
                                if (musicTimeBeforeVideo > 0) {
                                    bgMusic.currentTime = musicTimeBeforeVideo;
                                    if (!userManuallyPausedMusic) {
                                        playMusic();
                                    }
                                    musicTimeBeforeVideo = 0;
                                }
                                video.removeEventListener('ended', onVideoEnd);
                            };
                            
                            video.addEventListener('ended', onVideoEnd);
                        };
                        
                        playIcon.addEventListener('click', playVideo);
                        poster.addEventListener('click', playVideo);
                        
                        video.addEventListener('pause', () => {
                            if (currentPlayingVideo === video) {
                                poster.style.display = 'block';
                                playIcon.style.display = 'block';
                                currentPlayingVideo = null;
                                
                                if (musicTimeBeforeVideo > 0) {
                                    bgMusic.currentTime = musicTimeBeforeVideo;
                                    if (!userManuallyPausedMusic) {
                                        playMusic();
                                    }
                                    musicTimeBeforeVideo = 0;
                                }
                            }
                        });
                        
                        videoList.appendChild(item);
                    });
                } catch (error) {
                    videoList.innerHTML = '<p style="color:white; text-align:center;">视频加载出错</p>';
                }
            }

            // ==================== 音乐控制 ====================
            const musicBtn = document.getElementById('musicBtn');
            const bgMusic = document.getElementById('bgMusic');
            const musicTooltip = document.getElementById('musicTooltip');
            let isMusicPlaying = false;
            let hasShownTooltip = false;

            function playMusic() {
                bgMusic.play().catch(() => {});
                musicBtn.innerHTML = '<i class="fas fa-pause"></i>';
                isMusicPlaying = true;
                userManuallyPausedMusic = false;
            }

            function pauseMusic() {
                bgMusic.pause();
                musicBtn.innerHTML = '<i class="fas fa-music"></i>';
                isMusicPlaying = false;
            }

            musicBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isMusicPlaying) {
                    pauseMusic();
                    userManuallyPausedMusic = true;
                } else {
                    playMusic();
                }
            });

            document.addEventListener('click', (e) => {
                if (e.target.closest('#settingsBtn') || 
                    e.target.closest('#settingsPanel') || 
                    e.target.closest('#musicBtn') || 
                    e.target.closest('.image-viewer') ||
                    e.target.closest('.video-player-container')) {
                    return;
                }
                
                if (!isMusicPlaying && !userManuallyPausedMusic) {
                    playMusic();
                }
                
                if (!hasShownTooltip) {
                    musicTooltip.classList.add('show');
                    setTimeout(() => {
                        musicTooltip.classList.remove('show');
                        hasShownTooltip = true;
                    }, 5000);
                }
            });

            // ==================== 初始化 ====================
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    document.getElementById('charactersContainer').classList.add('characters-moved');
                }, 100);
                
                autoGenerateHearts();
                typeNotice();
            });

            window.addEventListener('beforeunload', cleanupVideos);
        })();
    </script>
</body>
</html>
